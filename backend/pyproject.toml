[project]
name = "stepwise-backend"
version = "0.1.0"
description = "Stepwise backend: accessible pedestrian routing for elderly/mobility-limited users"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "osmnx>=1.9",
    "networkx>=3.3",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "openai>=1.50",
    "pydantic>=2.9",
    "httpx>=0.27",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
